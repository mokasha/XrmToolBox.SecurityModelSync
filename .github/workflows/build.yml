name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # A tag such as v1.2026.12.1 sets the assembly and package version.
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "VERSION_ARG=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build SecurityModelSync.sln -c Release ${{ env.VERSION_ARG }}

      - name: Engine tests
        run: dotnet run --project tests/EngineTests -c Release --no-build

      - name: Pack
        run: dotnet pack src/SecurityModelSync/SecurityModelSync.csproj -c Release --no-build -o artifacts ${{ env.VERSION_ARG }}

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

      # Needs a repository secret named NUGET_API_KEY. Runs for version tags only.
      - name: Push to nuget.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push "artifacts\*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
